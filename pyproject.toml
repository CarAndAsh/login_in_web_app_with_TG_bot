[project]
name = "login-in-web-app-with-tg-bot"
version = "0.1.0"
description = "At start it's simple app to show user data from Telegram by using bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22.0",
    "fastapi>=0.116.1",
    "fastapi-jsonapi>=3.0.0",
    "pydantic-settings>=2.10.1",
    "pydantic[email]>=2.11.7",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "uv>=0.8.11",
]
